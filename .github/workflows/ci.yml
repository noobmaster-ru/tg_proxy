name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run lint
        run: make lint

      - name: Compile check
        run: python -m compileall axiomai_proxy

      - name: Run tests
        run: pytest -q
