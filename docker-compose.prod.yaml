services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  observer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "axiomai_proxy.observer"]
    env_file:
      - .env
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    restart: "no"
